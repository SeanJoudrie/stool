<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef4ee" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c1410" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Stool" />
    <meta
      name="description"
      content="A poop journal. Log it in about fifteen seconds, see what keeps showing up before a bad one, and print something you can hand to a doctor. Free, works offline, and never leaves your phone."
    />

    <!--
      Share metadata. Absolute URLs on purpose: scrapers do not resolve
      relative paths, and a link with no preview card looks abandoned the
      moment it lands in someone's messages.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stool" />
    <meta property="og:url" content="https://seanjoudrie.github.io/stool/" />
    <meta property="og:title" content="Stool — a poop journal" />
    <meta
      property="og:description"
      content="Log it in about fifteen seconds, see what keeps showing up before a bad one, and print something you can hand to a doctor. Free, works offline, never leaves your phone."
    />
    <meta property="og:image" content="https://seanjoudrie.github.io/stool/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Stool — a poop journal. Free, works offline, never leaves your phone."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stool — a poop journal" />
    <meta
      name="twitter:description"
      content="Log it in about fifteen seconds, see what keeps showing up before a bad one, and print something you can hand to a doctor."
    />
    <meta name="twitter:image" content="https://seanjoudrie.github.io/stool/og.png" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Stool — a poop journal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
